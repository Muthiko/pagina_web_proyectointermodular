<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutiger Aero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" class="bg-black"></div>
  <div id="bubbles"></div>

  <div id="stage">
    <!-- The two glossy pawns (CSS recreation) -->
    <div id="logo" class="logo">
      <div class="pawn green">
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="pawn blue">
        <div class="head"></div>
        <div class="body"></div>
      </div>
    </div>

    <!-- Info cards (start hidden, small, behind logo) -->
    <div id="cards"></div>
  </div>

  <div id="hint">Haz clic en los peones</div>

  <script src="script.js"></script>
</body>
</html>
